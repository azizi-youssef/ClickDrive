# Maintenance du suivi GPS (frontend/src/app/api/cron/tracking) : alertes « boîtier hors ligne », clôture des
# trajets abandonnés et purge des données expirées selon la conservation configurée par chaque agence.
# Secrets du dépôt : CLICKDRIVE_APP_URL (ex. https://clickdrive.ma) et CRON_SECRET (même valeur que sur l'hébergeur).
# Sans eux, la tâche s'arrête sans erreur (suivi non configuré).
name: Maintenance du suivi GPS

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler la maintenance du suivi GPS
        env:
          APP_URL: ${{ secrets.CLICKDRIVE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets CLICKDRIVE_APP_URL / CRON_SECRET absents : maintenance du suivi GPS non configurée."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/tracking"
